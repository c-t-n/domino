site_name: Domino
site_description: A small, dependency-free library for Domain-Driven Design in Python.
# Set site_url (and optionally repo_url) before publishing, e.g. for gh-deploy:
# site_url: https://<user>.github.io/domino/
# repo_url: https://github.com/<user>/domino

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Domain-Driven Design:
      - Why DDD?: ddd/why.md
      - The building blocks: ddd/building-blocks.md
      - Layering & bounded contexts: ddd/layering.md
  - Building with Domino:
      - Quickstart: guide/quickstart.md
      - Value objects: guide/value-objects.md
      - Entities & aggregates: guide/entities-aggregates.md
      - Domain events: guide/events.md
      - Repositories & unit of work: guide/persistence.md
      - Commands & use cases: guide/use-cases.md
      - Specifications: guide/specifications.md
      - Correlation ids & logging: guide/observability.md
      - Configuration: guide/configuration.md
  - Infrastructure:
      - SQLAlchemy: infrastructure/sqlalchemy.md
  - Presentation:
      - FastAPI: presentation/fastapi.md
  - Tutorial:
      - Order domain: tutorial/order-domain.md
  - Reference:
      - Cheat sheet: reference/cheatsheet.md
      - Scaffolding: reference/scaffolding.md
  - Roadmap:
      - Integrations: roadmap/integrations.md
  - Publishing the docs: publishing.md
