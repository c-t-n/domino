[project]
name = "domino"
version = "0.1.0"
description = "A small library for Domain-Driven Design in Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domino"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    # Keep the classic Generic/TypeVar style consistently across the library
    # (Result needs method-level type vars, which read worse under PEP 695).
    "UP046",
    "UP047",
    # __all__ is grouped by architectural layer on purpose, not sorted.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ty>=0.0.70",
]
