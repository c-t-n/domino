[project]
# The import name stays `domino`; only the distribution name is prefixed,
# because `domino` is already taken on PyPI.
name = "pydomino"
version = "0.2.0"
description = "A small library for Domain-Driven Design in Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ddd", "domain-driven-design", "aggregate", "unit-of-work", "domain-events"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/c-t-n/domino"
Documentation = "https://github.com/c-t-n/domino/tree/main/docs"
Source = "https://github.com/c-t-n/domino"
Issues = "https://github.com/c-t-n/domino/issues"
Changelog = "https://github.com/c-t-n/domino/releases"

[project.optional-dependencies]
# The asyncio extra pulls in greenlet, which SQLAlchemy's async engine needs at
# runtime. Bring your own async driver (aiosqlite, asyncpg, …) for async use.
sqlalchemy = ["sqlalchemy[asyncio]>=2.0"]
# FastAPI presentation-layer integration (async-first).
fastapi = ["fastapi>=0.115"]
# Redis Streams publisher and consumer for domain events.
redis = ["redis>=5"]
# RabbitMQ (AMQP) publisher and consumer, over aio-pika.
rabbitmq = ["aio-pika>=9"]
# Kafka publisher and consumer, over aiokafka.
kafka = ["aiokafka>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domino"]

# Only used by the release workflow's dry run (`uv publish --index testpypi`);
# `explicit` keeps dependency resolution off TestPyPI.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a live external service (skipped unless its URL is set)",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    # Keep the classic Generic/TypeVar style consistently across the library
    # (Result needs method-level type vars, which read worse under PEP 695).
    "UP046",
    "UP047",
    # __all__ is grouped by architectural layer on purpose, not sorted.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "ty>=0.0.70",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "httpx>=0.27",
    "redis>=5",
    "fakeredis>=2.23",
    "aio-pika>=9",
    "aiokafka>=0.11",
]
docs = [
    "mkdocs-material>=9.5",
]
