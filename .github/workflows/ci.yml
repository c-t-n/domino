name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync (all extras + groups)
        run: uv sync --all-extras --all-groups

      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

      - name: Format (ruff)
        run: uv run --no-sync ruff format --check .

      - name: Type check (ty)
        run: uv run --no-sync ty check

      - name: Tests (pytest)
        run: uv run --no-sync pytest -q

  integration:
    name: integration (live brokers)
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync (all extras + groups)
        run: uv sync --all-extras --all-groups

      # A broker that never came up would leave every test skipped and the job
      # green, which is exactly the failure this job exists to catch.
      - name: Check the broker is reachable
        run: |
          python - <<'PY'
          import socket
          with socket.create_connection(("localhost", 5672), timeout=15):
              print("RabbitMQ is accepting connections")
          PY

      - name: Integration tests
        run: uv run --no-sync pytest -q -m integration -ra

  docs:
    name: docs (strict build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build docs
        run: uv run --group docs mkdocs build --strict
